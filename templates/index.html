<!-- Step 3: Print Settings -->
        <div class="step-content" id="step-3">
            <h2 class="styled-heading">⚙️ Print Settings</h2>
            
            <div class="form-group">
                <label>Color Mode</label>
                <select id="color-mode" onchange="calculatePrice(); updateLivePreviewIfOpen();">
                    <option value="bw">Black & White (₹2/page)</option>
                    <option value="color">Color (₹10/page)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Paper Size</label>
                <select id="paper-size">
                    <option value="A4">A4 Size</option>
                </select>
            </div>

            <div class="form-group">
                <label>Orientation</label>
                <select id="orientation" onchange="updateLivePreviewIfOpen();">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sides / Layout</label>
                <select id="sides">
                    <option value="single">Print on 1 Side</option>
                    <option value="double">Print on Both Sides (Duplex)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Pages per Sheet</label>
                <select id="pages-per-sheet" onchange="calculatePrice(); updateLivePreviewIfOpen();">
                    <option value="1">1 Page per sheet</option>
                    <option value="2">2 Pages per sheet</option>
                    <option value="4">4 Pages per sheet</option>
                </select>
            </div>

            <div class="form-group">
                <label>Copies</label>
                <input type="number" id="copies" value="1" min="1" max="100" oninput="if(this.value > 100) this.value = 100; if(this.value < 1) this.value = 1; calculatePrice();">
                <small style="color: #ff4d4d; display: block; margin-top: 4px;">⚠️ Max limit: 100 copies allowed per print.</small>
            </div>

            <div class="form-group">
                <label>Page Range (e.g., 1-5 or leave blank for all)</label>
                <input type="text" id="page-range" placeholder="All pages" oninput="calculatePrice(); updateLivePreviewIfOpen();">
            </div>

            <!-- Action Buttons for Preview and Edit -->
            <div style="margin-top: 15px; margin-bottom: 20px; display: flex; gap: 10px;">
                <button type="button" class="btn secondary-btn" style="flex: 1; border: 1px dashed #38bdf8; color: #38bdf8;" onclick="triggerDocumentPreview()">
                    👁️ Preview
                </button>
                <button type="button" class="btn secondary-btn" style="flex: 1; border: 1px dashed #f59e0b; color: #f59e0b;" onclick="setStep(2)">
                    ✏️ Edit / Change File
                </button>
            </div>

            <div class="btn-row">
                <button class="btn secondary-btn" onclick="setStep(2)">Back</button>
                <button class="btn" onclick="goToStep4()">Next</button>
            </div>
        </div>
