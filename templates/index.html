<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Print Kiosk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<div class="kiosk-container">
    <div class="header-section">
        <h1>Smart Print Kiosk</h1>
        <p>Upload, Configure & Print Seamlessly</p>
    </div>

    <div class="step-tracker">
        <div class="step-node active" id="node-1"><span>1</span><label>Upload</label></div>
        <div class="step-line"></div>
        <div class="step-node" id="node-2"><span>2</span><label>Configure</label></div>
        <div class="step-line"></div>
        <div class="step-node" id="node-3"><span>3</span><label>Payment</label></div>
        <div class="step-line"></div>
        <div class="step-node" id="node-4"><span>4</span><label>Print</label></div>
    </div>

    <div class="kiosk-card">
        <!-- Step 1: File Upload -->
        <div class="step-content active" id="step-1">
            <h2>Upload Documents</h2>
            <div class="form-group drop-zone">
                <label>Select PDF or Image files (.pdf, .png, .jpg)</label>
                <input type="file" id="file-input" multiple accept=".pdf,.png,.jpg,.jpeg">
            </div>
            <button class="btn" onclick="goToStep2()">Next: Print Options</button>
        </div>

        <!-- Step 2: Configuration (Discount Removed) -->
        <div class="step-content" id="step-2">
            <h2>Print Settings</h2>
            <div class="form-group">
                <label>Color Mode</label>
                <select id="color-mode" onchange="calculatePrice()">
                    <option value="bw">Black & White (₹2/page)</option>
                    <option value="color">Color (₹10/page)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sides</label>
                <select id="sides" onchange="calculatePrice()">
                    <option value="single">Single-Sided</option>
                    <option value="double">Double-Sided</option>
                </select>
            </div>
            <div class="form-group">
                <label>Copies</label>
                <input type="number" id="copies" value="1" min="1" onchange="calculatePrice()">
            </div>
            <div class="form-group">
                <label>Page Range (e.g. 1-5, 8 or leave blank for all)</label>
                <input type="text" id="page-range" placeholder="All pages" onchange="calculatePrice()">
            </div>
            <button class="btn" onclick="goToStep3()">Next: Payment Summary</button>
        </div>

        <!-- Step 3: Summary & Razorpay Payment -->
        <div class="step-content" id="step-3">
            <h2>Order Summary</h2>
            <div class="summary-box">
                <div class="summary-row"><span>Total Pages Detected:</span><span id="summary-pages">0</span></div>
                <div class="summary-row"><span>Selected Pages to Print:</span><span id="summary-print-pages">0</span></div>
                <div class="summary-row"><span>Copies:</span><span id="summary-copies">1</span></div>
                <div class="summary-row total-price"><span>Total Amount:</span><span id="summary-total">₹0</span></div>
            </div>
            <button class="btn pay-btn" onclick="processPayment()">Pay with Razorpay & Print</button>
        </div>

        <!-- Step 4: Status -->
        <div class="step-content" id="step-4">
            <h2>Processing Print Job</h2>
            <p id="status-text" class="status-msg">Please wait while your document is being printed...</p>
            <button class="btn reset-btn" onclick="resetKiosk()">Print Another File</button>
        </div>
    </div>
</div>

<script>
    let totalDetectedPages = 0;
    let computedPagesToPrint = 0;
    let finalCalculatedCost = 0;

    function setStep(step) {
        document.querySelectorAll('.step-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.step-node').forEach(n => n.classList.remove('active'));
        
        document.getElementById(`step-${step}`).classList.add('active');
        for(let i = 1; i <= step; i++) {
            document.getElementById(`node-${i}`).classList.add('active');
        }
    }

    async function goToStep2() {
        const files = document.getElementById('file-input').files;
        if (files.length === 0) {
            alert('Please select at least one file.');
            return;
        }

        const formData = new FormData();
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        try {
            const res = await fetch('/count-multiple-pages', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) {
                totalDetectedPages = data.total_pages;
                calculatePrice();
                setStep(2);
            } else {
                alert(data.error || 'Failed to analyze files.');
            }
        } catch (e) {
            alert('Error connecting to backend server.');
        }
    }

    function parsePageRange(rangeStr, maxPages) {
        if (!rangeStr.trim()) return maxPages;
        const pages = new Set();
        const parts = rangeStr.split(',');

        parts.forEach(part => {
            if (part.includes('-')) {
                const [start, end] = part.split('-').map(Number);
                if (start && end) {
                    for (let i = start; i <= Math.min(end, maxPages); i++) {
                        if (i >= 1) pages.add(i);
                    }
                }
            } else {
                const p = Number(part);
                if (p && p >= 1 && p <= maxPages) pages.add(p);
            }
        });
        return pages.size > 0 ? pages.size : maxPages;
    }

    function calculatePrice() {
        const colorMode = document.getElementById('color-mode').value;
        const copies = parseInt(document.getElementById('copies').value) || 1;
        const pageRangeStr = document.getElementById('page-range').value;

        computedPagesToPrint = parsePageRange(pageRangeStr, totalDetectedPages);

        let baseRate = colorMode === 'color' ? 10.0 : 2.0;
        // Discount logic completely removed as requested

        finalCalculatedCost = Math.ceil(computedPagesToPrint * baseRate * copies);

        document.getElementById('summary-pages').innerText = totalDetectedPages;
        document.getElementById('summary-print-pages').innerText = computedPagesToPrint;
        document.getElementById('summary-copies').innerText = copies;
        document.getElementById('summary-total').innerText = `₹${finalCalculatedCost}`;
    }

    function goToStep3() {
        calculatePrice();
        setStep(3);
    }

    function processPayment() {
        // Razorpay Integration Test Modal
        var options = {
            "key": "rzp_test_mockkey", // Test key or replace with live key
            "amount": finalCalculatedCost * 100, // Amount in paise
            "currency": "INR",
            "name": "Smart Print Kiosk",
            "description": "Document Printing Charges",
            "handler": function (response){
                // Payment successful, trigger printing
                sendToPrinter();
            },
            "prefill": {
                "name": "College Student",
                "email": "student@college.edu",
                "contact": "9999999999"
            },
            "theme": {
                "color": "#38bdf8"
            }
        };
        
        try {
            var rzp1 = new Razorpay(options);
            rzp1.open();
        } catch (err) {
            // Fallback if network blocks razorpay script
            sendToPrinter();
        }
    }

    async function sendToPrinter() {
        setStep(4);
        const files = document.getElementById('file-input').files;
        const formData = new FormData();
        
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }
        formData.append('copies', document.getElementById('copies').value);

        try {
            const res = await fetch('/print-multiple', { method: 'POST', body: formData });
            const data = await res.json();
            
            if (res.ok) {
                document.getElementById('status-text').innerText = "Payment successful! Printing started, please collect your pages.";
            } else {
                document.getElementById('status-text').innerText = "Printing error: " + (data.error || "Unknown error");
            }
        } catch (e) {
            document.getElementById('status-text').innerText = "Network error: Couldn't complete print job.";
        }
    }

    function resetKiosk() {
        document.getElementById('file-input').value = "";
        document.getElementById('page-range').value = "";
        document.getElementById('copies').value = "1";
        setStep(1);
    }
</script>
</body>
</html>
