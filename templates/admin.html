<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Print - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">🖨️ Campus Print Dashboard</h1>
            <a href="/admin/logout" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-600 transition">Logout</a>
        </div>

        <div class="bg-white shadow-md rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Pending Print Queue (Live)</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full table-auto">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-left">File Name</th>
                            <th class="py-3 px-6 text-center">Copies</th>
                            <th class="py-3 px-6 text-center">Color Mode</th>
                            <th class="py-3 px-6 text-center">Orientation</th>
                            <th class="py-3 px-6 text-center">Sides (Duplex)</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-table-body" class="text-gray-600 text-sm font-light">
                        <tr>
                            <td colspan="5" class="py-4 px-6 text-center text-gray-400">Loading pending jobs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchAdminData() {
            try {
                const jobsRes = await fetch('/get-pending-jobs');
                if (jobsRes.status === 401) {
                    window.location.href = '/admin/login';
                    return;
                }
                const jobsData = await jobsRes.json();
                const tbody = document.getElementById('jobs-table-body');
                tbody.innerHTML = '';

                if (jobsData.jobs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-4 px-6 text-center text-gray-400">No pending print jobs.</td></tr>`;
                    return;
                }

                jobsData.jobs.forEach(job => {
                    const row = document.createElement('tr');
                    row.className = 'border-b border-gray-200 hover:bg-gray-50';
                    row.innerHTML = `
                        <td class="py-3 px-6 text-left whitespace-nowrap font-medium text-gray-700">${job.original_name}</td>
                        <td class="py-3 px-6 text-center">${job.copies}</td>
                        <td class="py-3 px-6 text-center uppercase">${job.color_mode}</td>
                        <td class="py-3 px-6 text-center capitalize">${job.orientation}</td>
                        <td class="py-3 px-6 text-center">${job.duplex ? 'Double Sided' : 'Single Sided'}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Error fetching admin data:', err);
            }
        }

        // Poll every 3 seconds to update queue view automatically
        setInterval(fetchAdminData, 3000);
        fetchAdminData();
    </script>
</body>
</html>
